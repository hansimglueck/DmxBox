<!DOCTYPE html>
<html>
<head>
	<title>Nutant Light</title>
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<link rel="icon" href="data:,">
	<link rel="stylesheet" type="text/css" href="style.css">
</head>
<body>
	<div id="connectionStatus" class="connection-indicator connected">
		<span id="statusText">● Connected</span>
	</div>
	
	<h1>Nutant Lamp is: <strong> %STATE%</strong></h1>
	<div class ='circleBase' id='rotateMode'>

		<a href="/left"><button id="left" class="button">left</button></a>

		<a href="/right"><button id="right" class="button">right</button></a>
		
		<a href="/up"><button id="up" class="button">up</button></a>
		
		<a href="/down"><button id="down" class="button">down</button></a>

	</div>
	<p><a href="/on"><button class="button">TURN ON</button></a><a href="/off"><button class="button button2">TURN OFF</button></a></p>
	<p><a href="/down"><button class="button">DOWN</button></a><a href="/up"><button class="button button2">UP</button></a></p>
	<p><a href="/left"><button class="button">LEFT</button></a><a href="/right"><button class="button button2">RIGHT</button></a></p>
	<p><a href="/channels"><button class="button button2">CHANNELS</button></a></p>
	<p><a href="/save"><button class="button button2">SAVE</button></a></p>

	<script>
		let checkInterval;
		let reconnectAttempts = 0;
		const maxReconnectAttempts = 5;
		
		function checkConnection() {
			fetch('/status', { 
				method: 'GET',
				cache: 'no-cache',
				headers: { 'Cache-Control': 'no-cache' }
			})
			.then(response => {
				if (response.ok) {
					setConnectionStatus(true);
					reconnectAttempts = 0;
				} else {
					setConnectionStatus(false);
				}
			})
			.catch(error => {
				setConnectionStatus(false);
				reconnectAttempts++;
				if (reconnectAttempts >= maxReconnectAttempts) {
					document.getElementById('statusText').textContent = 
						'● Disconnected - Reload page to reconnect';
				}
			});
		}
		
		function setConnectionStatus(connected) {
			const indicator = document.getElementById('connectionStatus');
			const statusText = document.getElementById('statusText');
			
			if (connected) {
				indicator.className = 'connection-indicator connected';
				statusText.textContent = '● Connected';
			} else {
				indicator.className = 'connection-indicator disconnected';
				if (reconnectAttempts < maxReconnectAttempts) {
					statusText.textContent = '● Reconnecting... (' + reconnectAttempts + '/' + maxReconnectAttempts + ')';
				} else {
					statusText.textContent = '● Disconnected';
				}
			}
		}
		
		// Check connection every 5 seconds
		checkInterval = setInterval(checkConnection, 5000);
		
		// Initial check after 1 second
		setTimeout(checkConnection, 1000);
	</script>
</body>
</html>
