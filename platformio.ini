; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags = 
    -DWIFI_SSID='"dmxbox6"'
    -DWIFI_PASSWORD='"schoenh3ll"'
    -DWIFI_CONNECT_SSID='""'
    -DWIFI_CONNECT_PASSWORD='""'
    -DDMX_SERIAL_OUTPUT_PIN=17
    -DDMX_SERIAL_INPUT_PIN=16
    -DDMX_DIRECTION_PIN=15
    -DDMX_PORT=1
lib_deps = 
	ESPAsyncWebServer-esphome
	AsyncTCP-esphome
	someweisguy/esp_dmx@^4.0.0

; OTA Upload configuration
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = 
;     --auth=12345678
;     --port=3232

[env:esp32-c3-devkitm-1]
platform = espressif32
board = esp32-c3-devkitm-1
framework = arduino
monitor_speed = 115200
build_flags = 
    -DWIFI_SSID='"dmxbox6"'
    -DWIFI_PASSWORD='"schoenh3ll"'
    -DWIFI_CONNECT_SSID='""'
    -DWIFI_CONNECT_PASSWORD='""'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DDMX_SERIAL_OUTPUT_PIN=21
    -DDMX_SERIAL_INPUT_PIN=20
    -DDMX_DIRECTION_PIN=10
    -DDMX_PORT=1
lib_deps = 
	ESPAsyncWebServer-esphome
	AsyncTCP-esphome
	someweisguy/esp_dmx@^4.0.0

; OTA Upload configuration
; upload_protocol = espota
; upload_port = 192.168.4.1
; upload_flags = 
;     --auth=12345678
;     --port=3232
