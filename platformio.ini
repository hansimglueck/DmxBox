; Heltec WiFi LoRa 32 V4 (ESP32-S3 based, no dedicated V4 board def → use V3)
; Do not use GPIO26: it is the PSRAM chip select on ESP32-S3 (crashes when toggled)
[env:heltec-v4]
platform = espressif32@^6.3.2
board = heltec_wifi_lora_32_V3
framework = arduino
extra_scripts = pre:version.py
upload_speed = 460800
monitor_speed = 115200
monitor_port = /dev/cu.usbmodem*
monitor_filters =
    default
    time
board_build.flash_mode = dio
; V4 has 16 MB flash (the V3 board definition assumes 8 MB)
board_upload.flash_size = 16MB
board_build.partitions = large_spiffs_16MB.csv
; ESP32-S3R2: 2 MB quad PSRAM (the V3 board definition has none). Allocations above 4 KB (page buffers)
; go there, so parallel page requests cannot exhaust the internal heap.
board_build.arduino.memory_type = dio_qspi

build_flags =
    -DBOARD_HAS_PSRAM
    -DWIFI_SSID='"dmxbox"'
    -DWIFI_PASSWORD='"schoenh3ll"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DDMX_SERIAL_OUTPUT_PIN=48
    -DDMX_SERIAL_INPUT_PIN=47
    -DDMX_DIRECTION_PIN=45
    -DDMX_PORT=1
    -DHAS_OLED
    -DHAS_LORA
    -DHOSTNAME_MAC_SUFFIX
    -DHAS_FW_UPDATE
lib_deps =
    ESPAsyncWebServer-esphome
    AsyncTCP-esphome
    someweisguy/esp_dmx@^4.0.0
    bblanchon/ArduinoJson@^7
    thingpulse/ESP8266 and ESP32 OLED driver for SSD1306 displays@^4.6.1
    jgromes/RadioLib@^7

; Generic ESP32-S3 N16R8 board (16 MB flash, 8 MB octal PSRAM), e.g. for working on the web interface
; without a Heltec. No LoRa, no OLED. Octal PSRAM occupies GPIO35-37, keep DMX away from them.
[env:esp32-s3-n16r8]
platform = espressif32@^6.3.2
board = esp32-s3-devkitc-1
framework = arduino
extra_scripts = pre:version.py
upload_speed = 921600
monitor_speed = 115200
monitor_filters =
    default
    time
board_build.flash_mode = qio
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_build.partitions = large_spiffs_16MB.csv

build_flags =
    -DWIFI_SSID='"dmxbox-s3"'
    -DWIFI_PASSWORD='"schoenh3ll"'
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=3
    -DBOARD_HAS_PSRAM
    -DDMX_SERIAL_OUTPUT_PIN=17
    -DDMX_SERIAL_INPUT_PIN=18
    -DDMX_DIRECTION_PIN=16
    -DDMX_PORT=1
    -DHOSTNAME_MAC_SUFFIX
    -DHAS_FW_UPDATE
lib_deps =
    ESPAsyncWebServer-esphome
    AsyncTCP-esphome
    someweisguy/esp_dmx@^4.0.0
    bblanchon/ArduinoJson@^7
