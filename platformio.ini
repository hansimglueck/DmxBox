; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

; MINIMAL OTA RECOVERY - Nur AP + OTA, nichts anderes
; Flashe zuerst diese minimal Firmware, dann die volle
[env:esp32dev-recovery]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_src_filter =
    +<minimal_ota.cpp>
    -<main.cpp>
build_flags =
    -Os                          ; Optimize for size
    -DCORE_DEBUG_LEVEL=0        ; No debug output
    -DARDUINO_LOOP_STACK_SIZE=2048  ; Smaller stack

upload_protocol = espota
upload_port = 192.168.4.1
upload_flags =
    --auth=schoenh3ll
    --port=3232

[env:esp32dev]
platform = espressif32@^6.3.2
board = esp32dev
framework = arduino
extra_scripts = pre:version.py
monitor_speed = 115200

build_flags =
    -DWIFI_SSID='"dmxbox33"'
    -DWIFI_PASSWORD='"schoenh3ll"'
    -DDMX_SERIAL_OUTPUT_PIN=17
    -DDMX_SERIAL_INPUT_PIN=16
    -DDMX_DIRECTION_PIN=15
    -DDMX_PORT=1
lib_deps =
	ESPAsyncWebServer-esphome
	AsyncTCP-esphome
	someweisguy/esp_dmx@^4.0.0
	bblanchon/ArduinoJson@^7

